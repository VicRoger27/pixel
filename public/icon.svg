<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#161922" stroke="#2F3647" stroke-width="1.5" />
  <g shape-rendering="crispEdges">
    <!-- Subtle pixel canvas checker hints -->
    <rect x="4" y="4" width="4" height="4" fill="#1D222E" />
    <rect x="12" y="4" width="4" height="4" fill="#1D222E" />
    <rect x="20" y="4" width="4" height="4" fill="#1D222E" />
    <rect x="24" y="8" width="4" height="4" fill="#1D222E" />
    <rect x="4" y="12" width="4" height="4" fill="#1D222E" />
    <rect x="24" y="16" width="4" height="4" fill="#1D222E" />
    <rect x="4" y="20" width="4" height="4" fill="#1D222E" />
    <rect x="16" y="24" width="4" height="4" fill="#1D222E" />

    <!-- PixelDraft "P" mark with warm sunset dithering -->
    <rect x="8" y="6" width="4" height="4" fill="#FFF1E8" />
    <rect x="12" y="6" width="4" height="4" fill="#FFEC27" />
    <rect x="16" y="6" width="4" height="4" fill="#FFA300" />

    <rect x="8" y="10" width="4" height="4" fill="#FFEC27" />
