    <rect x="16" y="14" width="4" height="4" fill="#FF004D" />

    <rect x="8" y="18" width="4" height="4" fill="#FF004D" />
    <rect x="8" y="22" width="4" height="4" fill="#7E2553" />

    <!-- Dithered scatter accent pixels -->
    <rect x="16" y="18" width="4" height="4" fill="#7E2553" />
    <rect x="20" y="22" width="4" height="4" fill="#29ADFF" />
  </g>
